<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masuk - Sistem Antrian Rumah Sakit</title>
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="dist/login.js" defer></script>
</head>
<body>
  <main class="login-wrapper">
    <div class="login-card">
      <div class="login-header">
        <h1>Masuk</h1>
        <p>Halaman ini untuk mengakses Dashboard Admin dan Panel Operator. Layar Kiosk tidak memerlukan login.</p>
      </div>

      <div id="errorAlert" class="alert alert-danger" style="display: none;"></div>

      <form id="loginForm" autocomplete="off">
        <div class="form-group">
          <label class="form-label" for="username">Username</label>
          <input 
            type="text" 
            id="username" 
            class="form-input" 
            placeholder="emilys" 
            required 
            autocomplete="username"
          >
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input 
            type="password" 
            id="password" 
            class="form-input" 
            placeholder="••••••••••" 
            required 
            autocomplete="current-password"
          >
        </div>

        <button type="submit" id="submitBtn" class="login-btn">
          Masuk
        </button>
      </form>

      <div class="login-helper">
        <p style="text-align: center; margin-bottom: 0.5rem;">
          Gunakan akun uji dari <strong>dummyjson.com/users</strong>:
        </p>
        <div class="login-helper-pills">
          <button type="button" class="helper-pill" data-test-user="emilys" data-test-pass="emilyspass">
            <span><strong>emilys</strong> (Admin)</span>
            <span style="color: var(--primary);">Gunakan &rarr;</span>
          </button>
          <button type="button" class="helper-pill" data-test-user="oliviaw" data-test-pass="oliviawpass">
            <span><strong>oliviaw</strong> (Moderator)</span>
            <span style="color: var(--primary);">Gunakan &rarr;</span>
          </button>
          <button type="button" class="helper-pill" data-test-user="averyp" data-test-pass="averyppass">
            <span><strong>averyp</strong> (User Biasa)</span>
            <span style="color: var(--primary);">Gunakan &rarr;</span>
          </button>
        </div>

        <div style="margin-top: 1.25rem; text-align: center; display: flex; justify-content: center; gap: 1rem; font-size: 0.8rem;">
          <a href="layar.html" style="color: var(--primary); text-decoration: none;">📺 Layar Antrian</a>
          <span style="color: var(--border-color);">|</span>
          <a href="ambil-antrian.html" style="color: var(--primary); text-decoration: none;">🎫 Ambil Nomor</a>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
