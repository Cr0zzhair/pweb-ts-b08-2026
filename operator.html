<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Operator - Sistem Antrian Rumah Sakit</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@300;400;500;600;700&family=Permanent+Marker&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="dist/operator.js" defer></script>
</head>
<body class="app-layout">
  <!-- Sidebar Kiri Konsisten -->
  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="brand-icon">✚</div>
      <div>
        <div class="brand-title">MEDIKA ARCANE</div>
        <div class="brand-subtitle">ANTRIAN RUMAH SAKIT</div>
      </div>
    </div>

    <div class="arcane-divider" style="margin: 1.25rem 0;">
      <span class="arcane-divider-label">NAVIGASI</span>
    </div>

    <nav class="nav-links sidebar-nav">
      <a href="index.html" id="adminNavLink" class="nav-link">
        <span class="nav-icon">📊</span>
        <span>Dashboard Admin</span>
      </a>
      <a href="operator.html" class="nav-link active">
        <span class="nav-icon">⚕</span>
        <span>Panel Operator</span>
      </a>
      <a href="layar.html" class="nav-link">
        <span class="nav-icon">🖥️</span>
        <span>Layar Monitor</span>
      </a>
      <a href="ambil-antrian.html" class="nav-link">
        <span class="nav-icon">🎫</span>
        <span>Ambil Nomor</span>
      </a>
    </nav>

    <div class="sidebar-actions">
      <button id="soundToggleBtn" class="btn btn-secondary btn-sm btn-block" title="Aktifkan/matikan suara panggilan">
        🔊 Suara: Aktif
      </button>
    </div>

    <div class="sidebar-footer">
      <div class="user-badge sidebar-user">
        <span id="navUser">Admin</span>
        <span id="navRole" class="role-pill role-admin">ADMIN</span>
      </div>

      <button id="logoutBtn" class="btn btn-secondary btn-sm btn-block">
        Keluar
      </button>
    </div>
  </aside>

  <!-- Konten Utama Halaman -->
  <main class="main-content">
    <div class="page-header" style="margin-bottom: 1.5rem;">
      <div>
        <div class="eyebrow-label">PANEL PEMANGGILAN</div>
        <h1 class="page-title">PANEL <span class="brush-accent">OPERATOR</span></h1>
        <p class="page-subtitle">Panggil tiket sesuai urutan prioritas (VIP / Disabilitas / Lansia didahulukan).</p>
      </div>
    </div>

    <!-- Kartu Operator per Jenis Antrian -->
    <div id="operatorCardsContainer" class="grid-3">
      <!-- Diisi secara dinamis oleh dist/operator.js -->
    </div>
  </main>
</body>
</html>
